stages:
  - test
  - build
  - verify

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

# 1. Test Stage: Run unit tests using python image
test-job:
  stage: test
  image: python:3.11-slim
  script:
    - pip install -r requirements.txt
    - python -m pytest

# 2. Build Stage: Build and push to GitLab Container Registry
build-job:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE_TAG .
    - docker push $IMAGE_TAG

# 3. Verify Stage: Pull and test the container execution
verify-job:
  stage: verify
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker run -d -p 8000:8000 --name test-app $IMAGE_TAG
    - sleep 3
    - docker exec test-app python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/health').read())"